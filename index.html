<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0466FC" />
    <title>OpenPass — Ingressos digitais</title>
    <meta name="description" content="OpenPass: venda, emissão e validação de ingressos digitais para eventos" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Aplica o tema salvo ANTES do primeiro paint, pra não piscar claro e
      // depois escurecer. Mantido em sincronia com src/contexts/ThemeContext.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('openpass-theme')
          // Padrão é sempre claro (não segue mais a preferência do sistema).
          if (stored === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="bg-paper text-ink font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
